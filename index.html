<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorepad — Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef1e6;
    --paper-line: #b9c7cf;
    --paper-margin: #d68e88;
    --ink-red: #a3312a;
    --ink-blue: #2b4b6f;
    --pencil: #4a4740;
    --pencil-soft: #7a766c;
    --hole: #c8cdb9;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #d9dccb;
    color: var(--pencil);
    font-family: 'Special Elite', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .pad {
    position: relative;
    width: 100%;
    max-width: 760px;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    background-position: 0 6px;
    box-shadow: 0 2px 0 #cfd3c0, 0 18px 34px rgba(30, 30, 20, 0.28);
    padding: 40px 44px 34px 74px;
    border-radius: 2px;
  }

  .pad::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 52px;
    width: 2px;
    background: var(--paper-margin);
    opacity: 0.6;
  }

  .holes {
    position: absolute;
    left: -14px;
    top: 30px;
    bottom: 30px;
    width: 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .holes span {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--hole);
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.25);
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1 {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 44px;
    margin: 0;
    color: var(--pencil);
    transform: rotate(-1deg);
  }

  .dateline {
    font-size: 12px;
    color: var(--pencil-soft);
    letter-spacing: 0.03em;
  }

  .rule {
    border: none;
    border-top: 1px dashed var(--pencil-soft);
    opacity: 0.5;
    margin: 14px 0 22px;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 36px;
  }

  @media (max-width: 620px) {
    .layout { grid-template-columns: 1fr; }
    .pad { padding: 34px 24px 28px 56px; }
    .holes { display: none; }
    .pad::before { left: 20px; }
  }

  .status-line {
    font-size: 14px;
    margin-bottom: 16px;
    color: var(--pencil);
  }
  .status-line .who { font-weight: 700; }
  .status-line.win { color: var(--ink-red); }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
  }

  .board svg.grid-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .board svg.grid-lines path {
    stroke: var(--pencil);
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
  }

  .cells {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 100%;
    height: 100%;
  }

  .cell {
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10%;
  }
  .cell:not(.filled):not(.locked):hover {
    background: rgba(74, 71, 64, 0.05);
  }

  .cell svg.mark {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .cell svg.mark path, .cell svg.mark circle {
    fill: none;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 260;
    stroke-dashoffset: 260;
    animation: ink 0.4s ease forwards;
  }
  .mark-x path { stroke: var(--ink-red); }
  .mark-o circle { stroke: var(--ink-blue); }

  @keyframes ink {
    to { stroke-dashoffset: 0; }
  }

  .cell.winning svg.mark path,
  .cell.winning svg.mark circle {
    stroke: var(--ink-red);
  }
  .cell.winning {
    background: rgba(163, 49, 42, 0.08);
  }

  .side h2 {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 10px;
    color: var(--pencil);
  }

  .tally-block { margin-bottom: 20px; }
  .tally-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .tally-row .who { width: 40px; font-weight: 700; }
  .tally-row.x .who { color: var(--ink-red); }
  .tally-row.o .who { color: var(--ink-blue); }
  .tally-row .marks {
    flex: 1;
    min-height: 20px;
    color: var(--pencil);
    font-size: 16px;
    letter-spacing: 1px;
  }
  .tally-row .count { font-size: 11px; color: var(--pencil-soft); }

  .mode-toggle {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 22px;
  }
  .mode-btn {
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--pencil-soft);
    color: var(--pencil-soft);
    font-family: 'Special Elite', monospace;
    font-size: 12px;
    padding: 7px 2px;
    cursor: pointer;
  }
  .mode-btn.active { color: var(--ink-red); font-weight: 700; }
  .mode-btn.active::before { content: "\2611 "; }
  .mode-btn:not(.active)::before { content: "\2610 "; }

  button.reset {
    width: 100%;
    background: transparent;
    border: 1px solid var(--pencil);
    color: var(--pencil);
    font-family: 'Special Elite', monospace;
    font-size: 12px;
    padding: 10px;
    cursor: pointer;
    transform: rotate(-0.4deg);
  }
  button.reset:hover {
    background: var(--pencil);
    color: var(--paper);
  }

  footer {
    margin-top: 26px;
    font-size: 11px;
    color: var(--pencil-soft);
    text-align: right;
  }
</style>
</head>
<body>

<div class="pad">
  <div class="holes">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <header>
    <h1>tic-tac-toe scorepad</h1>
    <span class="dateline">The Odin Project · Foundations</span>
  </header>
  <hr class="rule">

  <div class="layout">
    <div>
      <p class="status-line" id="status"><span class="who">X</span>'s turn to mark</p>
      <div class="board">
        <svg class="grid-lines" viewBox="0 0 300 300" preserveAspectRatio="none">
          <path d="M 101 8 C 99 100, 103 200, 100 292"></path>
          <path d="M 201 6 C 203 100, 198 200, 200 294"></path>
          <path d="M 8 101 C 100 99, 200 103, 292 100"></path>
          <path d="M 6 201 C 100 203, 200 198, 294 200"></path>
        </svg>
        <div class="cells" id="board"></div>
      </div>
    </div>

    <div class="side">
      <h2>players</h2>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="ai">you vs. the pad (AI)</button>
        <button class="mode-btn" data-mode="human">two players, pass &amp; play</button>
      </div>

      <h2>score</h2>
      <div class="tally-block">
        <div class="tally-row x">
          <span class="who">X</span>
          <span class="marks" id="tallyX">—</span>
          <span class="count" id="countX">(0)</span>
        </div>
        <div class="tally-row o">
          <span class="who">O</span>
          <span class="marks" id="tallyO">—</span>
          <span class="count" id="countO">(0)</span>
        </div>
        <div class="tally-row">
          <span class="who">tie</span>
          <span class="marks" id="tallyTie">—</span>
          <span class="count" id="countTie">(0)</span>
        </div>
      </div>

      <button class="reset" id="resetBtn">tear off, new round</button>
    </div>
  </div>

  <footer>vanilla JS · module pattern · minimax</footer>
</div>

<script>
(function () {
  'use strict';

  // ---------- Gameboard module ----------
  const Gameboard = (function () {
    let board = Array(9).fill('');
    const getBoard = () => board.slice();
    const setCell = (i, mark) => {
      if (board[i] !== '') return false;
      board[i] = mark;
      return true;
    };
    const reset = () => { board = Array(9).fill(''); };
    const isFull = () => board.every((c) => c !== '');
    return { getBoard, setCell, reset, isFull };
  })();

  // ---------- Player factory ----------
  const Player = (mark, isAI = false) => ({ mark, isAI });

  // ---------- Win detection ----------
  const WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6],
  ];

  function getWinner(board) {
    for (const line of WIN_LINES) {
      const [a, b, c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { mark: board[a], line };
      }
    }
    return null;
  }

  // ---------- Minimax AI ----------
  function minimax(board, depth, isMaximizing, aiMark, humanMark) {
    const winner = getWinner(board);
    if (winner) return winner.mark === aiMark ? 10 - depth : depth - 10;
    if (board.every((c) => c !== '')) return 0;

    const mark = isMaximizing ? aiMark : humanMark;
    let best = isMaximizing ? -Infinity : Infinity;

    for (let i = 0; i < 9; i++) {
      if (board[i] !== '') continue;
      board[i] = mark;
      const score = minimax(board, depth + 1, !isMaximizing, aiMark, humanMark);
      board[i] = '';
      best = isMaximizing ? Math.max(best, score) : Math.min(best, score);
    }
    return best;
  }

  function bestMove(board, aiMark, humanMark) {
    let move = -1;
    let bestScore = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (board[i] !== '') continue;
      board[i] = aiMark;
      const score = minimax(board, 0, false, aiMark, humanMark);
      board[i] = '';
      if (score > bestScore) {
        bestScore = score;
        move = i;
      }
    }
    return move;
  }

  // ---------- Game controller ----------
  const GameController = (function () {
    let mode = 'ai';
    let current = null;
    let over = false;
    const playerX = Player('X');
    const playerO = Player('O', true);
    const scores = { X: 0, O: 0, tie: 0 };

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const tallyX = document.getElementById('tallyX');
    const tallyO = document.getElementById('tallyO');
    const tallyTie = document.getElementById('tallyTie');
    const countX = document.getElementById('countX');
    const countO = document.getElementById('countO');
    const countTie = document.getElementById('countTie');

    function buildCells() {
      boardEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement('button');
        btn.className = 'cell';
        btn.dataset.index = i;
        btn.addEventListener('click', onCellClick);
        boardEl.appendChild(btn);
      }
    }

    function markSVG(mark) {
      if (mark === 'X') {
        return `<svg class="mark mark-x" viewBox="0 0 100 100"><path d="M20 18 C45 45, 55 55, 82 84"></path><path d="M82 18 C58 44, 44 56, 18 84"></path></svg>`;
      }
      return `<svg class="mark mark-o" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34"></circle></svg>`;
    }

    function render(winnerInfo) {
      const board = Gameboard.getBoard();
      [...boardEl.children].forEach((cell, i) => {
        cell.innerHTML = board[i] ? markSVG(board[i]) : '';
        cell.classList.toggle('filled', !!board[i]);
        cell.classList.toggle('locked', over);
        cell.classList.remove('winning');
      });
      if (winnerInfo) {
        winnerInfo.line.forEach((i) => boardEl.children[i].classList.add('winning'));
      }
    }

    function setStatus(text, isWin) {
      statusEl.innerHTML = text;
      statusEl.classList.toggle('win', !!isWin);
    }

    // Render a running score as hand-tally strokes: 4 uprights, 5th crosses them.
    function tallyMarks(n) {
      if (n === 0) return '—';
      let out = '';
      for (let i = 1; i <= n; i++) {
        out += (i % 5 === 0) ? '\u0338' : '|';
        out += ' ';
      }
      return out.trim();
    }

    function updateScoreboard() {
      tallyX.textContent = tallyMarks(scores.X);
      tallyO.textContent = tallyMarks(scores.O);
      tallyTie.textContent = tallyMarks(scores.tie);
      countX.textContent = `(${scores.X})`;
      countO.textContent = `(${scores.O})`;
      countTie.textContent = `(${scores.tie})`;
    }

    function endTurnChecks() {
      const board = Gameboard.getBoard();
      const winner = getWinner(board);
      if (winner) {
        over = true;
        scores[winner.mark] += 1;
        updateScoreboard();
        render(winner);
        setStatus(`<span class="who">${winner.mark}</span> wins the round`, true);
        return true;
      }
      if (Gameboard.isFull()) {
        over = true;
        scores.tie += 1;
        updateScoreboard();
        render(null);
        setStatus("Board full — nobody's round", true);
        return true;
      }
      return false;
    }

    function aiTurn() {
      const aiMark = playerO.mark;
      const humanMark = playerX.mark;
      const move = bestMove(Gameboard.getBoard(), aiMark, humanMark);
      if (move === -1) return;
      Gameboard.setCell(move, aiMark);
      render(null);
      if (endTurnChecks()) return;
      current = 'X';
      setStatus(`<span class="who">${current}</span>'s turn to mark`);
    }

    function onCellClick(e) {
      if (over) return;
      const i = Number(e.currentTarget.dataset.index);
      if (mode === 'ai' && current === 'O') return;

      if (!Gameboard.setCell(i, current)) return;
      render(null);
      if (endTurnChecks()) return;

      current = current === 'X' ? 'O' : 'X';
      setStatus(`<span class="who">${current}</span>'s turn to mark`);

      if (mode === 'ai' && current === 'O' && !over) {
        setTimeout(aiTurn, 350);
      }
    }

    function newRound() {
      Gameboard.reset();
      over = false;
      current = 'X';
      buildCells();
      render(null);
      setStatus(`<span class="who">${current}</span>'s turn to mark`);
    }

    function setMode(newMode) {
      mode = newMode;
      newRound();
    }

    function init() {
      buildCells();
      newRound();
      updateScoreboard();
      document.getElementById('resetBtn').addEventListener('click', newRound);
      document.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          setMode(btn.dataset.mode);
        });
      });
    }

    return { init };
  })();

  GameController.init();
})();
</script>

</body>
</html>
